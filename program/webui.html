<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>ember</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0d1016; color: #c8d0de; font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  #app { display: flex; height: 100%; }

  /* ---------- 侧边栏 ---------- */
  aside {
    width: 260px; flex: none; background: #0a0d12; border-right: 1px solid #1b202b;
    display: flex; flex-direction: column;
  }
  .brand { padding: 14px 14px 10px; font-size: 16px; font-weight: 600; color: #dfe6f2; }
  .brand .ver { font-size: 11px; color: #4d5563; margin-left: 6px; font-weight: 400; }
  #newBtn {
    margin: 0 12px 10px; padding: 8px; cursor: pointer; font-size: 13px;
    background: #1a2130; color: #cfe0ff; border: 1px solid #263047; border-radius: 6px;
  }
  #newBtn:hover { background: #212a3c; }
  #sessions { list-style: none; margin: 0; padding: 0 8px; overflow-y: auto; flex: 1; }
  #sessions li {
    position: relative; padding: 8px 46px 8px 10px; margin-bottom: 4px; border-radius: 6px;
    cursor: pointer; border: 1px solid transparent; color: #a7b0c0;
  }
  #sessions li:hover { background: #1a1f2b; }
  #sessions li.on { background: #1b2333; border-color: #2f3d5c; color: #dfe6f2; }
  #sessions .t { font-size: 12px; color: #b9c3d4; font-weight: 600; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; padding-left: 14px; }
  #sessions li.on .t { color: #e6eeff; }
  #sessions .q { font-size: 12px; color: #636c7c; margin-top: 3px; padding-left: 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot {
    position: absolute; left: 9px; top: 15px; width: 7px; height: 7px; border-radius: 50%;
  }
  .dot.b { background: #e0af68; box-shadow: 0 0 0 2px rgba(224,175,104,.18); }
  .dot.u { background: #9ece6a; }
  .dot.c { background: #f7768e; }
  .act {
    position: absolute; right: 4px; top: 6px; opacity: .55;
    -webkit-user-select: none; -ms-user-select: none; user-select: none;
  }
  #sessions li:hover .act { opacity: 1; }
  .act span {
    display: inline-block; width: 24px; height: 24px; line-height: 24px; text-align: center;
    font-size: 16px; color: #b6c0d0; margin-left: 1px; border-radius: 5px; cursor: pointer;
  }
  .act span:hover { color: #e6eeff; background: #2b3446; }
  #foot { padding: 8px 14px; font-size: 11px; color: #4d5563; border-top: 1px solid #161b24; }

  /* ---------- 主区 ---------- */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px; border-bottom: 1px solid #1b202b; font-size: 13px; color: #8b93a3;
  }
  #title { color: #dfe6f2; font-weight: 600; }
  #meta { color: #6b7484; margin-right: 8px; }
  #build { color: #3f4756; font-size: 11px; margin-right: 8px; }
  #reloadBtn, #plainBtn {
    padding: 2px 8px; cursor: pointer; font-size: 11px; background: #1a1f2b; color: #8b93a3;
    border: 1px solid #262b36; border-radius: 4px;
  }
  #plainBtn.on { background: #24314a; color: #cfe0ff; border-color: #3a4a6b; }
  #reloadBtn { margin-left: 8px; }
  #reloadBtn.on { background: #24314a; color: #cfe0ff; border-color: #3a4a6b; }

  #log { flex: 1; overflow-y: auto; padding: 16px 20px 8px; }

  .msg { margin-bottom: 14px; max-width: 900px; }
  .msg .who { font-size: 11px; color: #5f6877; margin-bottom: 4px; letter-spacing: .5px;
    -webkit-user-select: none; -ms-user-select: none; user-select: none; }
  .msg .body { white-space: pre-wrap; word-break: break-word; }
  .msg.user .body {
    background: #161d2b; border-left: 3px solid #7aa2f7; padding: 8px 12px; border-radius: 0 6px 6px 0;
  }
  .msg.ai .body { padding: 2px 0; }
  .msg.err .body { color: #f7768e; }
  .msg.note .body { color: #7d8697; font-style: italic; font-size: 12px; }
  .msg.note { margin-bottom: 6px; }
  .plain .msg .who { display: none; }

  .copy {
    float: right; font-size: 11px; color: #59616e; cursor: pointer;
    border: 1px solid #232a37; border-radius: 4px; padding: 1px 6px;
    -webkit-user-select: none; -ms-user-select: none; user-select: none;
  }
  .copy:hover { color: #c8d3e8; border-color: #3a4354; }
  .codebox { position: relative; margin: 8px 0; border: 1px solid #232a37; border-radius: 6px;
    background: #0d1016; overflow: hidden; }
  .codebox pre { margin: 0; padding: 10px 12px; overflow: auto; max-height: 420px;
    font: 12px/1.5 Consolas, "Courier New", monospace; color: #b8c2d4; white-space: pre; }
  .codebox .copy { position: absolute; right: 8px; top: 6px; background: #12151c; }
  .msg .resend { margin-left: 8px; color: #59616e; cursor: pointer; font-size: 11px;
    border: 1px solid #232a37; border-radius: 4px; padding: 1px 6px; }

  .tool {
    margin: 8px 0 12px; border: 1px solid #232a37; border-radius: 6px;
    background: #12151c; overflow: hidden;
  }
  .tool .hd {
    padding: 7px 10px; cursor: pointer; font-size: 12px; color: #9aa4b5;
    display: flex; align-items: center; gap: 8px;
  }
  .tool .hd:hover { background: #171b24; }
  .tool .name { color: #7dcfff; font-family: Consolas, monospace; }
  .tool .args { color: #6b7484; font-family: Consolas, monospace; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .tool pre {
    margin: 0; padding: 10px; max-height: 320px; overflow: auto;
    background: #0d1016; color: #b8c2d4; font: 12px/1.5 Consolas, "Courier New", monospace;
    border-top: 1px solid #1c222d; white-space: pre-wrap;
  }
  .tool.collapsed pre { display: none; }
  .tool .foot2 { padding: 6px 10px; border-top: 1px solid #1c222d; font-size: 11px; color: #59616e; }

  /* ---------- 输入区 ---------- */
  #composer { border-top: 1px solid #1b202b; padding: 10px 16px 14px; }
  #stat { font-size: 12px; color: #6b7484; margin-bottom: 6px; min-height: 16px; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  #input {
    flex: 1; min-height: 64px; max-height: 220px; resize: vertical;
    background: #11151d; color: #c8d0de; border: 1px solid #232a37; border-radius: 6px;
    padding: 8px 10px; font: inherit; outline: none;
  }
  #input:focus { border-color: #33415c; }
  #send, #stopBtn {
    padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 13px; border: 1px solid #2c3a58;
    background: #24314a; color: #cfe0ff;
  }
  #send:hover { background: #2b3a58; }
  #send:disabled { opacity: .5; cursor: default; }
  #stopBtn { background: #3a1f26; border-color: #5c2c37; color: #ffb4c0; display: none; }
  #stopBtn:hover { background: #4a2730; }

  /* ---------- 确认弹窗 ---------- */
  #mask { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 10; display: none; }
  #dialog {
    position: fixed; z-index: 11; left: 50%; top: 22%; transform: translateX(-50%);
    width: 560px; max-width: 92vw; background: #141a24; border: 1px solid #2b3446;
    border-radius: 8px; padding: 16px 18px; display: none;
  }
  #dialog h3 { margin: 0 0 8px; font-size: 14px; color: #ffd08a; }
  #dialog .dargs {
    font: 12px/1.5 Consolas, monospace; color: #b8c2d4; background: #0d1016;
    border: 1px solid #232a37; border-radius: 6px; padding: 8px 10px; max-height: 180px;
    overflow: auto; white-space: pre-wrap; margin-bottom: 10px;
  }
  #dialog .danger { color: #f7768e; font-size: 12px; margin-bottom: 10px; }
  #dialog .btns { text-align: right; }
  #dialog button {
    padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-left: 8px;
    background: #1a1f2b; color: #c8d0de; border: 1px solid #2b3446;
  }
  #dyes { background: #24314a; border-color: #3a4a6b; color: #cfe0ff; }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand">ember<span class="ver" id="ver"></span></div>
    <button id="newBtn">+ 新会话</button>
    <ul id="sessions"></ul>
    <div id="foot">已连接</div>
  </aside>

  <main>
    <header>
      <span id="title">未选择会话</span>
      <span>
        <span id="build">界面 __BUILD__</span>
        <span id="meta"></span>
        <button id="reloadBtn" title="重新读取 config.txt（后填的 API Key 不用重启 web.cmd）">刷新</button>
        <button id="plainBtn" title="只显示正文，隐藏“谁说的”和复制按钮">简洁</button>
      </span>
    </header>

    <div id="log"></div>

    <div id="composer">
      <div id="stat">就绪</div>
      <div class="row">
        <textarea id="input" placeholder="输入需求…（Enter 发送，Shift+Enter 换行；可直接多行粘贴）"></textarea>
        <button id="send">发送</button>
        <button id="stopBtn">停止</button>
      </div>
    </div>
  </main>
</div>

<div id="mask"></div>
<div id="dialog">
  <h3 id="dtitle">要执行一个命令，可以吗？</h3>
  <div class="dargs" id="dargs"></div>
  <div class="danger" id="ddanger"></div>
  <div class="btns">
    <button id="dno">跳过</button>
    <button id="dyes">执行</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // v2.3.1：老 IE（尤其 IE8）缺这些 API，会静默死掉 —— 先说清楚，别让用户对着白屏
  if (!document.addEventListener || !window.XMLHttpRequest || !document.getElementsByClassName) {
    try {
      document.body.innerHTML = '<div style="padding:24px;font-size:16px;color:#c8d0de;background:#0d1016">' +
        '这个浏览器太老了（IE8 或更早），网页终端跑不起来。<br><br>' +
        '请用 Chrome / Edge / 360 极速模式打开这个地址；命令行版（run.cmd）不受影响。</div>';
    } catch (e) {}
    return;
  }

  var TOKEN = (function () {
    var m = /[?&]t=([0-9a-f]+)/.exec(location.search || "");
    return m ? m[1] : "";
  })();

  var current = "";          // 当前打开的会话名
  var busy = false;          // 当前会话是不是在跑
  var generation = 0;        // 切会话时作废在途请求
  var seqMap = {};           // 每个会话已收到的事件序号
  var lastSessions = [];     // 最近一次拿到的会话列表
  var hasKey = null;         // 服务端有没有 key（null=还不知道）
  var streamEl = null, streamBox = null, streamText = "";
  var confirmId = 0, confirmSession = "";
  var plainOn = true;
  try { plainOn = localStorage.getItem("ember.plain") !== "0"; } catch (e) { plainOn = true; }

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function api(path) {
    return path + (path.indexOf("?") >= 0 ? "&" : "?") + "t=" + TOKEN;
  }

  function xhr(method, url, body, ok, fail) {
    var x = new XMLHttpRequest();
    x.open(method, url, true);
    x.setRequestHeader("Content-Type", "application/json");
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      var data = null;
      try { data = x.responseText ? JSON.parse(x.responseText) : null; } catch (e) { data = null; }
      if (x.status >= 200 && x.status < 300) { if (ok) ok(data); }
      else if (fail) fail(x, data);
    };
    x.send(body === null || body === undefined ? null : JSON.stringify(body));
  }

  function copyText(t) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t);
        return;
      }
    } catch (e) {}
    var ta = document.createElement("textarea");
    ta.value = t; ta.style.position = "fixed"; ta.style.left = "-9999px";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e2) {}
    document.body.removeChild(ta);
  }

  function scrollDown(force) {
    var log = $("log");
    if (force || log.scrollHeight - log.scrollTop - log.clientHeight < 120) {
      log.scrollTop = log.scrollHeight;
    }
  }

  // ---------- 渲染 ----------
  function isNotice(t) {
    return /^（(本轮出错|本轮被中断|上次会话|模型这次|上下文已压缩)/.test(String(t || ""));
  }

  function addCopy(host, getter) {
    var c = document.createElement("span");
    c.className = "copy"; c.textContent = "复制";
    c.onclick = function () {
      copyText(getter());
      c.textContent = "已复制";
      setTimeout(function () { c.textContent = "复制"; }, 1200);
    };
    host.appendChild(c);
  }

  function renderRich(el, text) {
    el.innerHTML = "";
    var re = /```([a-zA-Z0-9_+-]*)\r?\n([\s\S]*?)```/g, last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) {
        var d = document.createElement("div");
        d.textContent = text.slice(last, m.index);
        el.appendChild(d);
      }
      var box = document.createElement("div");
      box.className = "codebox";
      var pre = document.createElement("pre");
      pre.textContent = m[2].replace(/\s+$/, "");
      var cp = document.createElement("span");
      cp.className = "copy"; cp.textContent = "复制代码";
      (function (txt) {
        cp.onclick = function () {
          copyText(txt); cp.textContent = "已复制";
          setTimeout(function () { cp.textContent = "复制代码"; }, 1200);
        };
      })(m[2]);
      box.appendChild(cp); box.appendChild(pre); el.appendChild(box);
      last = m.index + m[0].length;
    }
    if (last < text.length) {
      var rest = document.createElement("div");
      rest.textContent = text.slice(last);
      el.appendChild(rest);
    }
  }

  function addMsg(role, text, cls) {
    var d = document.createElement("div");
    var notice = role !== "user" && (role === "note" || isNotice(text));
    d.className = "msg " + (cls || (role === "user" ? "user" : (role === "note" ? "note" : "ai"))) +
                  (notice && role !== "note" ? " note" : "");
    var who = document.createElement("div");
    who.className = "who";
    who.textContent = role === "user" ? "你"
                    : (role === "error" ? "错误" : (role === "note" ? "" : (notice ? "提示" : "ember")));
    var body = document.createElement("div");
    body.className = "body";
    if (role !== "user" && role !== "note" && String(text || "").indexOf("```") >= 0) renderRich(body, text);
    else body.textContent = text;
    if (role !== "user" && role !== "note") addCopy(who, function () { return body.textContent; });
    if (role === "user") {
      var rs = document.createElement("span");
      rs.className = "resend"; rs.textContent = "重发"; rs.title = "把这条填回输入框";
      rs.onclick = function () {
        $("input").value = text; $("input").focus();
        $("stat").textContent = "已填回输入框，改完按 Enter 发送";
      };
      who.appendChild(rs);
    }
    d.appendChild(who); d.appendChild(body);
    $("log").appendChild(d);
    scrollDown(!text);
    return { root: d, body: body, who: who };
  }

  function addTool(name, args) {
    var d = document.createElement("div");
    d.className = "tool collapsed";
    var hd = document.createElement("div");
    hd.className = "hd";
    var car = document.createElement("span"); car.textContent = "▸"; car.className = "car";
    var nm = document.createElement("span"); nm.className = "name"; nm.textContent = name;
    var ag = document.createElement("span"); ag.className = "args";
    ag.textContent = typeof args === "string" ? args : JSON.stringify(args || {});
    hd.appendChild(car); hd.appendChild(nm); hd.appendChild(ag);
    var pre = document.createElement("pre");
    var foot = document.createElement("div"); foot.className = "foot2"; foot.textContent = "运行中…";
    d.appendChild(hd); d.appendChild(pre); d.appendChild(foot);
    hd.onclick = function () {
      var c = d.className.indexOf("collapsed") >= 0;
      d.className = c ? "tool" : "tool collapsed";
      car.textContent = c ? "▾" : "▸";
    };
    $("log").appendChild(d);
    scrollDown(true);
    return { root: d, pre: pre, foot: foot, car: car };
  }

  // ---------- 会话列表 ----------
  function defaultName(n) { return /^\d{8}-\d{6}(-\d+)?\.jsonl$/.test(String(n || "")); }
  function prettyName(n) {
    var m = /^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})/.exec(n || "");
    return m ? (m[1] + "-" + m[2] + "-" + m[3] + " " + m[4] + ":" + m[5]) : (n || "");
  }
  function displayTitle(n) {
    n = String(n || "");
    return defaultName(n) ? prettyName(n) : n.replace(/\.jsonl$/i, "");
  }

  function renderSessions(list) {
    var ul = $("sessions");
    ul.innerHTML = "";
    for (var i = 0; i < list.length; i++) {
      var it = list[i];
      var li = document.createElement("li");
      if (it.name === current) li.className = "on";
      li.innerHTML = '<div class="t">' + esc(it.title || displayTitle(it.name)) + '</div>' +
                     '<div class="q">' + esc(it.first || "(无提问)") + '</div>';
      var dot = document.createElement("span");
      dot.className = "dot " + (it.confirm ? "c" : (it.busy ? "b" : (it.unread ? "u" : "")));
      if (it.confirm) dot.title = "这个会话在等你确认";
      else if (it.busy) dot.title = "正在跑";
      else if (it.unread) dot.title = "有结果了，点开看看";
      li.appendChild(dot);
      (function (nm) { li.onclick = function () { switchTo(nm); }; })(it.name);

      var act = document.createElement("span");
      act.className = "act";
      var ren = document.createElement("span");
      ren.textContent = "✎"; ren.title = "重命名";
      (function (nm) { ren.onclick = function (e) { if (e) e.stopPropagation(); renameSession(nm); }; })(it.name);
      var del = document.createElement("span");
      del.textContent = "×"; del.title = "删除";
      (function (nm) { del.onclick = function (e) { if (e) e.stopPropagation(); deleteSession(nm); }; })(it.name);
      act.appendChild(ren); act.appendChild(del);
      li.appendChild(act);
      ul.appendChild(li);
    }
  }

  function refreshState() {
    xhr("GET", api("/api/state"), null, function (d) {
      if (!d || !d.ok) return;
      $("ver").textContent = d.version || "";
      lastSessions = d.sessions || [];
      renderSessions(lastSessions);
      if (d.session === current) {
        busy = !!d.busy;
        $("stopBtn").style.display = busy ? "inline-block" : "none";
        if (!busy && streamEl) { /* 等 turn_end 事件收尾 */ }
      }
      $("foot").textContent = "已连接 · " + (d.model || "");
      if (d.has_key === false && hasKey !== false) {
        $("stat").textContent = "还没有 API Key —— 填进 config.txt 后点右上角「刷新」";
      }
      hasKey = (d.has_key !== false);
    }, function () {
      $("foot").textContent = "连接断开，重启 web.cmd 后用窗口里的地址";
    });
  }

  // ---------- 切换会话 ----------
  function switchTo(name) {
    generation++;
    var mine = generation;
    current = name;
    streamEl = null; streamBox = null; streamText = "";
    $("log").innerHTML = "";
    $("title").textContent = displayTitle(name);
    $("stat").textContent = "加载中…";
    xhr("GET", api("/api/open?title=1&name=" + encodeURIComponent(name)), null, function (d) {
      if (mine !== generation) return;
      if (!d || !d.ok) { $("stat").textContent = "打开失败"; return; }
      renderHistory(d.messages || []);
      $("title").textContent = d.title || displayTitle(name);
      busy = !!d.busy;
      $("stopBtn").style.display = busy ? "inline-block" : "none";
      $("send").disabled = false;
      $("meta").textContent = (busy ? "运行中 · " : "") + "上下文 " + (d.ctx || 0) + " token";
      $("stat").textContent = busy ? "运行中…" : "就绪";
      seqMap[name] = d.seq || 0;
      renderSessions(d.sessions || []);
      if (d.pending_confirm) showConfirm(d.pending_confirm);
    });
  }

  function renderHistory(msgs) {
    var pending = {};
    for (var i = 0; i < msgs.length; i++) {
      var m = msgs[i];
      var role = m.role;
      if (role === "summary") { addMsg("note", "【早前对话摘要】\n" + (m.content || "")); continue; }
      if (role === "user") { addMsg("user", m.content || ""); continue; }
      if (role === "assistant") {
        var calls = m.tool_calls || [];
        if (m.content) addMsg("ai", m.content);
        for (var k = 0; k < calls.length; k++) {
          var fn = calls[k].function || {};
          var card = addTool(fn.name || "tool", fn.arguments || "");
          pending[calls[k].id] = card;
        }
        continue;
      }
      if (role === "tool") {
        var t = pending[m.tool_call_id];
        if (t) {
          t.pre.textContent = m.content || "";
          var one = String(m.content || "").replace(/\s+/g, " ").slice(0, 90);
          t.foot.textContent = one ? (one + (String(m.content || "").length > 90 ? " …" : "")) : "完成";
        }
      }
    }
  }

  // ---------- 事件 ----------
  function handle(ev) {
    if (ev.kind === "user") {
      addMsg("user", ev.text || "");
    } else if (ev.kind === "delta") {
      if (!streamEl) { streamEl = addMsg("ai", ""); streamBox = streamEl.body; streamText = ""; }
      streamText += ev.text || "";
      streamBox.textContent = streamText;
      scrollDown(false);
    } else if (ev.kind === "notice") {
      if (ev.text) addMsg("note", ev.text);
    } else if (ev.kind === "tool_call") {
      var card = addTool(ev.name, ev.args);
      card.pending = true;
    } else if (ev.kind === "tool_output") {
      var cards = document.getElementsByClassName("tool");
      if (cards.length) {
        var c = cards[cards.length - 1];
        if (c.className.indexOf("collapsed") >= 0) c.className = "tool";
        var pre = c.getElementsByTagName("pre")[0];
        var foot = c.getElementsByClassName("foot2")[0];
        var stick = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 60;
        pre.textContent += ev.text || "";
        if (stick) pre.scrollTop = pre.scrollHeight;
        foot.textContent = "运行中… 已收 " + Math.round((ev.total || 0) / 1024) + " KB";
      }
    } else if (ev.kind === "tool_result") {
      var cs = document.getElementsByClassName("tool");
      if (cs.length) {
        var cc = cs[cs.length - 1];
        cc.getElementsByTagName("pre")[0].textContent = ev.output || "";
        var f = cc.getElementsByClassName("foot2")[0];
        f.textContent = ev.summary || "完成";
      }
    } else if (ev.kind === "turn_end") {
      if (streamEl && streamText && streamText.indexOf("```") >= 0) renderRich(streamBox, streamText);
      streamEl = null; streamBox = null; streamText = "";
      busy = false;
      $("stopBtn").style.display = "none";
      $("stat").textContent = "完成 · 用时 " + Math.round(ev.elapsed || 0) + "s" +
        (ev.tools ? " · 工具 " + ev.tools + " 次" : "");
      refreshState();
    } else if (ev.kind === "error") {
      addMsg("error", ev.text || "出错了", "err");
      streamEl = null; streamBox = null; streamText = "";
      busy = false;
      $("stopBtn").style.display = "none";
      refreshState();
    } else if (ev.kind === "title") {
      refreshState();
    } else if (ev.kind === "confirm") {
      showConfirm(ev);
    }
  }

  function poll() {
    if (!current) { setTimeout(poll, 600); return; }
    var sess = current, mine = generation;
    var since = seqMap[sess] || 0;
    xhr("GET", api("/api/events?session=" + encodeURIComponent(sess) + "&since=" + since), null,
      function (list) {
        if (mine === generation && sess === current && list && list.length) {
          for (var i = 0; i < list.length; i++) {
            handle(list[i]);
            seqMap[sess] = list[i].seq;
          }
        }
        setTimeout(poll, 400);
      },
      function () { setTimeout(poll, 1500); });
  }

  // ---------- 确认弹窗 ----------
  function showConfirm(ev) {
    confirmId = ev.id || 0;
    confirmSession = ev.session || current;
    $("dtitle").textContent = (ev.danger ? "危险操作：" : "") + (ev.name || "工具") + " —— 执行吗？";
    $("dargs").textContent = typeof ev.args === "string" ? ev.args : JSON.stringify(ev.args || {}, null, 2);
    $("ddanger").textContent = ev.danger || "";
    $("mask").style.display = "block";
    $("dialog").style.display = "block";
  }

  function hideConfirm() {
    $("mask").style.display = "none";
    $("dialog").style.display = "none";
  }

  // ---------- 发送 ----------
  function reloadConfig(cb) {
    xhr("POST", api("/api/reload"), {}, function (d) {
      if (d && d.ok) {
        $("stat").textContent = d.has_key
          ? ("已读取配置 · 模型 " + (d.model || "?") + " · 可以发了")
          : "还是没有 API Key：把 sk-... 粘进 config.txt 的 api_key = 后面，再点刷新";
        $("reloadBtn").className = d.has_key ? "on" : "";
      } else {
        $("stat").textContent = "刷新失败";
      }
      if (cb) cb(d);
    }, function () {
      $("stat").textContent = "刷新失败（连不上服务）";
      if (cb) cb(null);
    });
  }

  function doSend(text, retried) {
    $("stat").textContent = "发送中…";
    xhr("POST", api("/api/chat"), { text: text, session: current }, function (d) {
      if (d && d.ok) {
        $("input").value = "";
        busy = true;
        $("stopBtn").style.display = "inline-block";
        $("stat").textContent = "运行中…";
      } else {
        $("stat").textContent = (d && d.error) || "发送失败";
      }
    }, function (x, d) {
      // v2.3.5：没 key 时自动重读一次 config.txt，读到就重试（不用重启 web.cmd）
      if (d && d.need_key && !retried) {
        $("stat").textContent = "还没有 API Key，正在重新读取 config.txt…";
        reloadConfig(function (info) {
          if (info && info.has_key) doSend(text, true);
        });
        return;
      }
      $("stat").textContent = (d && d.error) ||
        ("连不上服务（" + (x ? x.status : "?") + "），重启一次 web.cmd 试试");
    });
  }

  function sendNow() {
    var t = $("input").value;
    if (!t.replace(/\s/g, "")) return;
    if (current) { doSend(t, false); return; }
    // 一个会话都没开的时候，回车也应该能用：先建一个再发
    xhr("POST", api("/api/new"), {}, function (d) {
      if (d && d.ok) {
        current = d.session;
        seqMap[d.session] = 0;
        doSend(t, false);
      } else {
        $("stat").textContent = "新建会话失败";
      }
    }, function () { $("stat").textContent = "连不上服务，重启一次 web.cmd 试试"; });
  }

  function isEnter(ev) { return ev.key === "Enter" || ev.keyCode === 13 || ev.which === 13; }

  // ---------- 绑定 ----------
  $("send").onclick = sendNow;

  $("newBtn").onclick = function () {
    xhr("POST", api("/api/new"), {}, function (d) {
      if (d && d.ok) {
        seqMap[d.session] = 0;
        switchTo(d.session);
      }
    });
  };

  $("stopBtn").onclick = function () {
    $("stat").textContent = "正在停止…";
    xhr("POST", api("/api/stop"), { session: current }, function () {});
  };

  $("dyes").onclick = function () {
    hideConfirm();
    xhr("POST", api("/api/confirm"), { session: confirmSession, id: confirmId, ok: true });
  };
  $("dno").onclick = function () {
    hideConfirm();
    xhr("POST", api("/api/confirm"), { session: confirmSession, id: confirmId, ok: false });
  };

  $("input").onkeydown = function (e) {
    var ev = e || window.event;
    if (ev.isComposing || ev.keyCode === 229) return;
    if (!isEnter(ev)) return;
    if (ev.shiftKey || ev.altKey) return;
    if (ev.preventDefault) ev.preventDefault();
    sendNow();
    return false;
  };

  function applyPlain(on) {
    document.body.className = on ? "plain" : "";
    $("plainBtn").className = on ? "on" : "";
    plainOn = on;
    try { localStorage.setItem("ember.plain", on ? "1" : "0"); } catch (e) {}
  }
  $("plainBtn").onclick = function () { applyPlain(!plainOn); };
  $("reloadBtn").onclick = function () { reloadConfig(null); };

  function deleteSession(name) {
    if (!confirm("删除这个会话？\n" + name + "\n（连带归档，删了不能恢复）")) return;
    xhr("POST", api("/api/delete"), { name: name }, function (d) {
      if (d && d.ok) {
        if (current === name) {
          current = ""; $("log").innerHTML = ""; $("title").textContent = "未选择会话";
        }
        refreshState();
      } else {
        $("stat").textContent = "删除失败（可能正在跑）";
      }
    });
  }

  function renameSession(name) {
    var to = prompt("改个名字（不用写 .jsonl）", String(name).replace(/\.jsonl$/, ""));
    if (!to || to === name) return;
    xhr("POST", api("/api/rename"), { name: name, to: to }, function (d) {
      if (d && d.ok && d.session) {
        if (seqMap[name] !== undefined) {
          seqMap[d.session] = seqMap[name];
          delete seqMap[name];
        }
        if (current === name) current = d.session;
        $("stat").textContent = "已改名为「" + displayTitle(d.session) + "」";
        refreshState();
      } else {
        $("stat").textContent = "改名失败（重名、含非法字符，或还在跑）";
      }
    });
  }

  // ---------- 启动 ----------
  applyPlain(plainOn);
  refreshState();
  setInterval(refreshState, 1500);
  poll();
  setTimeout(function () {
    if (current) return;
    // 打开页面时：有会话在跑就先看它，否则看最近那个
    for (var i = 0; i < lastSessions.length; i++) {
      if (lastSessions[i].busy) { switchTo(lastSessions[i].name); return; }
    }
    var lis = $("sessions").getElementsByTagName("li");
    if (lis.length) lis[0].onclick();
  }, 700);
})();
</script>
</body>
</html>
